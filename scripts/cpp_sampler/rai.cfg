#Render/renderText: false

#scene: double_sphere
#scene: panda_sphere
#scene: panda_sphere_levels #THIS IS THE REFERENCE PROBLEM WITHOUT WALLS
#scene: sphere_cube
#scene: panda_cube
#scene: pandaS_cube
#scene: "4sphere_cube"
#scene: allegro_cube
#scene: allegroDown_cube
scene: sphere_T
#scene: g1_floor
num_samples: 50000
num_threads: 8

#disableGui: true

opt/stopEvals: 500
opt/stopTolerance: 1e-3
opt/stopFTolerance: 1e-3
opt/stopGTolerance: 1e-3
#opt/damping: 1e2

StableConfigSampler/verbose: 0
StableConfigSampler/frictionCone_mu: .8
# StableConfigSampler/prob_contact: .5
StableConfigSampler/resolveInitCollisions: false

RndStableConfigs/verbose: 1
RndStableConfigs/frictionCone_mu: .8
# RndStableConfigs/prob_contact: .5
RndStableConfigs/resolveInitCollisions: false


#KOMO/sparse: false

sam/eps: .05
sam/tolerance: 1e-3 #.01
sam/margin: .0
sam/useCentering: true
sam/makeDense: true

sam/verbose: 3

sam/seedMethod: "gauss" #"uni"
sam/seedCandidates: 10

sam/penaltyMu: 1.

sam/downhillMethod: "GN"

sam/downhillMaxSteps: 100 #50
sam/slackStepAlpha: 1.
sam/slackMaxStep: .1
sam/slackRegLambda: 1. #1e-2

sam/ineqOverstep: -1

sam/downhillNoiseMethod: "none"
sam/downhillRejectMethod: "none"
sam/downhillNoiseSigma: .1

sam/interiorMethod: "manifoldRRT" #"HR"

sam/interiorBurnInSteps: 0
sam/interiorSampleSteps: 10
sam/interiorNoiseMethod: "iso"
sam/hitRunEqMargin: .1

sam/interiorNoiseSigma: .5

sam/langevinTauPrime: -1.
